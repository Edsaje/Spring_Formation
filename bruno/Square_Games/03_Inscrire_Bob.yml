info:
  name: 3 - Inscrire Utilisateur (Bob - ROLE_USER)
  type: http
  seq: 3

http:
  method: POST
  url: "{{userServiceUrl}}/users"
  body:
    type: json
    data: |-
      {
        "username": "{{bobUsername}}",
        "email": "{{bobEmail}}",
        "password": "password123",
        "role": "ROLE_USER"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const ts = Date.now();
        bru.setVar("bobUsername", "bob_" + ts);
        bru.setVar("bobEmail", "bob_" + ts + "@example.com");
    - type: after-response
      code: |-
        bru.setVar("bobId", res.body.id);
    - type: tests
      code: |-
        test("Bob inscrit avec succès (201 Created)", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.body.id).to.be.a('string');
          expect(res.body.username).to.equal(bru.getVar("bobUsername"));
          expect(res.body.role).to.equal("ROLE_USER");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
