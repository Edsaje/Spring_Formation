info:
  name: 10 - Consulter Utilisateur par ID (Alice)
  type: http
  seq: 10

http:
  method: GET
  url: "{{userServiceUrl}}/users/{{userId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Utilisateur trouvé avec succès (200 OK)", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar("userId"));
          expect(res.body.username).to.equal("Alice");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
