info:
  name: 12 - Consulter l'État d'une Partie
  type: http
  seq: 12

http:
  method: GET
  url: "{{gameServiceUrl}}/games/{{gameId}}"
  headers:
    - name: Authorization
      value: "Bearer {{aliceToken}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("État de la partie récupéré avec succès (200 OK)", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar("gameId"));
          expect(res.body.boardSize).to.equal(3);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
