info:
  name: 7 - Connexion Échec (Mot de passe incorrect - 401)
  type: http
  seq: 7

http:
  method: POST
  url: "{{userServiceUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "alice",
        "password": "mauvais_mot_de_passe"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Connexion rejetée avec 401 Unauthorized", function() {
          expect(res.getStatus()).to.equal(401);
          expect(res.body.error).to.be.a('string');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
