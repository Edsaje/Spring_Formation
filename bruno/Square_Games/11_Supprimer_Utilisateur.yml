info:
  name: 11 - Supprimer Utilisateur (Alice)
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{userServiceUrl}}/users/{{userId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Utilisateur supprimé avec succès (204 No Content)", function() {
          expect(res.getStatus()).to.equal(204);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
