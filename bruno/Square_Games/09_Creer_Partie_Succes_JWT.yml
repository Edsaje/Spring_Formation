info:
  name: 9 - Créer Partie - Succès avec JWT (Alice contre Bob)
  type: http
  seq: 9

http:
  method: POST
  url: "{{gameServiceUrl}}/games"
  headers:
    - name: Authorization
      value: "Bearer {{aliceToken}}"
  body:
    type: json
    data: |-
      {
        "gameType": "tictactoe",
        "numberOfPlayers": 2,
        "boardSize": 3,
        "opponentIds": ["{{bobId}}"]
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("gameId", res.body.gameId);
        bru.setVar("currentPlayerId", res.body.currentPlayerId);
        if (res.body.currentPlayerId === bru.getVar("aliceId")) {
          bru.setVar("currentPlayerToken", bru.getVar("aliceToken"));
          bru.setVar("wrongPlayerToken", bru.getVar("bobToken"));
        } else {
          bru.setVar("currentPlayerToken", bru.getVar("bobToken"));
          bru.setVar("wrongPlayerToken", bru.getVar("aliceToken"));
        }
    - type: tests
      code: |-
        test("Partie créée avec succès via JWT (201 Created)", function() {
          expect(res.getStatus()).to.equal(201);
          expect(res.body.gameId).to.be.a('string');
          expect(res.body.currentPlayerId).to.be.a('string');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
