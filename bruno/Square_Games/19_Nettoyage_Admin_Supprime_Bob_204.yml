info:
  name: 19 - Nettoyage - Supprimer Bob par Admin (ROLE_ADMIN - 204)
  type: http
  seq: 19

http:
  method: DELETE
  url: "{{userServiceUrl}}/users/{{bobId}}"
  headers:
    - name: Authorization
      value: "Bearer {{adminToken}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Bob supprimé avec succès par Admin (204 No Content)", function() {
          expect(res.getStatus()).to.equal(204);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
