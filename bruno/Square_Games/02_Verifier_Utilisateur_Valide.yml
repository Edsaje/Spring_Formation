info:
  name: 2 - Vérifier Existence Utilisateur (Route Inter-Service)
  type: http
  seq: 2

http:
  method: GET
  url: "{{userServiceUrl}}/users/{{userId}}/valid"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("L'utilisateur doit être reconnu comme valide (200 true)", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body).to.equal(true);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
