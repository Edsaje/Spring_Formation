info:
  name: 6 - Lister les Parties de l'Utilisateur (Alice)
  type: http
  seq: 6

http:
  method: GET
  url: "{{gameServiceUrl}}/games"
  headers:
    - name: X-UserId
      value: "{{userId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Liste des parties récupérée avec succès (200 OK)", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body).to.be.an('array');
          expect(res.body.length).to.be.greaterThan(0);
          const found = res.body.some(g => g.id === bru.getVar("gameId"));
          expect(found).to.be.true;
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
