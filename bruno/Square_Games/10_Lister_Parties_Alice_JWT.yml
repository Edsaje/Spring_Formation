info:
  name: 10 - Lister les Parties d'Alice (via JWT)
  type: http
  seq: 10

http:
  method: GET
  url: "{{gameServiceUrl}}/games"
  headers:
    - name: Authorization
      value: "Bearer {{aliceToken}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Parties d'Alice récupérées avec succès (200 OK)", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body).to.be.an('array');
          expect(res.body.length).to.be.above(0);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
