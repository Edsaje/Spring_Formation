info:
  name: 4 - Créer Partie - Rejet 401 (Utilisateur Inconnu)
  type: http
  seq: 4

http:
  method: POST
  url: "{{gameServiceUrl}}/games"
  headers:
    - name: X-UserId
      value: "00000000-0000-0000-0000-000000000000"
  body:
    type: json
    data: |-
      {
        "gameType": "tictactoe",
        "numberOfPlayers": 2,
        "boardSize": 3
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejet avec statut 401 Unauthorized car l'utilisateur n'existe pas dans user-service", function() {
          expect(res.getStatus()).to.equal(401);
          expect(res.body.error).to.be.a('string');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
