info:
  name: 8 - Créer Partie - Rejeté (Sans Jeton JWT - 401)
  type: http
  seq: 8

http:
  method: POST
  url: "{{gameServiceUrl}}/games"
  body:
    type: json
    data: |-
      {
        "gameType": "tictactoe",
        "numberOfPlayers": 2,
        "boardSize": 3,
        "opponentIds": ["{{bobId}}"]
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Accès refusé sans authentification (401 Unauthorized)", function() {
          expect(res.getStatus()).to.equal(401);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
