info:
  name: 16 - RBAC - Lister Utilisateurs Autorisé pour Admin (ROLE_ADMIN - 200)
  type: http
  seq: 16

http:
  method: GET
  url: "{{userServiceUrl}}/users"
  headers:
    - name: Authorization
      value: "Bearer {{adminToken}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Liste des utilisateurs accessible pour Admin (200 OK)", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body).to.be.an('array');
          expect(res.body.length).to.be.above(0);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
