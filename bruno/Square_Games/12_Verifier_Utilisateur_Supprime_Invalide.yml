info:
  name: 12 - Vérifier Invalidité après Suppression
  type: http
  seq: 12

http:
  method: GET
  url: "{{userServiceUrl}}/users/{{userId}}/valid"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("L'utilisateur supprimé n'est plus valide (200 false)", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body).to.equal(false);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: "false"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
