info:
  name: 6 - Connexion Admin & Obtention JWT
  type: http
  seq: 6

http:
  method: POST
  url: "{{userServiceUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "admin123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("adminToken", res.body.token);
        bru.setVar("adminId", res.body.userId);
    - type: tests
      code: |-
        test("Admin connecté avec succès et JWT délivré (200 OK)", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body.token).to.be.a('string');
          expect(res.body.token.length).to.be.above(20);
          expect(res.body.username).to.equal("admin");
          expect(res.body.role).to.equal("ROLE_ADMIN");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
