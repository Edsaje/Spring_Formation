info:
  name: 8 - Jouer un Coup - Rejet 403 (Pas son tour)
  type: http
  seq: 8

http:
  method: POST
  url: "{{gameServiceUrl}}/games/{{gameId}}/moves"
  headers:
    - name: X-UserId
      value: "{{wrongPlayerId}}"
  body:
    type: json
    data: |-
      {
        "x": 0,
        "y": 0
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Rejet avec statut 403 Forbidden car ce n'est pas le tour de ce joueur", function() {
          expect(res.getStatus()).to.equal(403);
          expect(res.body.error).to.be.a('string');
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
