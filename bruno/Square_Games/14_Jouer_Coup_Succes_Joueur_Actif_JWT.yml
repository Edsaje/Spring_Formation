info:
  name: 14 - Jouer un Coup - Succès (Joueur Actif avec JWT)
  type: http
  seq: 14

http:
  method: POST
  url: "{{gameServiceUrl}}/games/{{gameId}}/moves"
  headers:
    - name: Authorization
      value: "Bearer {{currentPlayerToken}}"
  body:
    type: json
    data: |-
      {
        "x": 1,
        "y": 1
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Coup joué avec succès via JWT (200 OK)", function() {
          expect(res.getStatus()).to.equal(200);
          expect(res.body.id).to.equal(bru.getVar("gameId"));
          expect(res.body.currentPlayerId).to.not.equal(bru.getVar("currentPlayerId"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
