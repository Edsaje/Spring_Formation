server.port=8080
spring.application.name=square_games
spring.profiles.active=jpa

# URL du microservice distant de gestion des utilisateurs
services.user-service.url=http://localhost:8081

# Configuration JWT (Clé secrète partagée avec user-service)
jwt.secret=MaCleSecreteCommunePartageeEntreLesMicroservices123456789!

# Propriétés par défaut des jeux
game.tictactoe.default-player-count=2
game.tictactoe.default-board-size=3

game.connectfour.default-player-count=2
game.connectfour.default-board-size=7

game.taquin.default-player-count=1
game.taquin.default-board-size=4

spring.datasource.url=jdbc:postgresql://localhost:5432/square_games
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update